name = "CCO"
version = "0.1.0"
defaultTargets = ["CCO"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[require]]
name = "AllThoseEPPA"
git = "https://github.com/shulda/lean_all_those_eppa_classes.git"
rev = "cd358cde844d5419fd43f30c441511927e09142f"

[[require]]
name = "CCORamsey"
path = "vendor/ramsey"

[[lean_lib]]
name = "CCO"

# Finite upstream proof closure, with its original receiving compiler options.
# This is a library in this package: the receiving manifest is unchanged.
[[lean_lib]]
name = "AlgebraicAutomata"
srcDir = "vendor/factorization-forest"
roots = ["AlgebraicAutomata.FactorizationForest.Tree"]
globs = ["AlgebraicAutomata.+"]
leanOptions = {pp.unicode.fun = true, autoImplicit = false, relaxedAutoImplicit = false, weak.linter.mathlibStandardSet = true, maxSynthPendingDepth = 3}
