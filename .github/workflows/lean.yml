name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # External checks load legacy build-directory oleans, so materialize
      # outputs even if Lake can use a content-addressed artifact internally.
      LAKE_RESTORE_ARTIFACTS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Validate mathematical preparation and project allocation
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -q
          for module in raw_exact strong_selectors parity_hasse exact_crt canonical_hull real_closure finite_packets rigid_groupoid finite_kernel owner_action sir; do
            python3 tools/build_formalization_module.py --module "$module" --check
          done
          python3 tools/check_formalization_coordination.py --check --require-launch
          for control in tools/check_*_controls.py; do
            python3 "$control"
          done

      # Cache the toolchain, not multi-gigabyte per-commit .lake workspaces.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Install pinned Lean and Lake
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      # Follow all CCO edges first. The pinned Mathlib cache command filters
      # CCO imports, so `cache get CCO.lean` cannot discover these roots.
      - name: Download targeted Mathlib cache
        shell: bash
        run: |
          python3 tools/mathlib_cache_roots.py --reject-broad > /tmp/cco-mathlib-roots.txt
          mapfile -t roots < /tmp/cco-mathlib-roots.txt
          lake exe cache get "${roots[@]}"

      # Reuse project artifacts only. Lake checks source/dependency traces;
      # a restored cache never replaces the build or the transitive audit.
      - name: Cache incremental CCO build
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: cco-project-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            cco-project-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      # Detect inconsistent manual/cached snapshots by hashing actual CCO
      # olean bytes against trace outputs, preserving every consistent child.
      - name: Repair inconsistent project artifacts
        run: python3 tools/verify_project_cache.py --repair

      - name: Build and audit Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          use-github-cache: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: CCO
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Verify materialized project artifacts
        run: python3 tools/verify_project_cache.py
