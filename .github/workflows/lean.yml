name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # External checks load legacy build-directory oleans, so materialize
      # outputs even if Lake can use a content-addressed artifact internally.
      LAKE_RESTORE_ARTIFACTS: "true"
      # Reuse the validated project archive without a second artifact-cache
      # restoration path; changed-source recovery also rehashes all inputs.
      LAKE_ARTIFACT_CACHE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate mathematical preparation and project allocation
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -q
          for module in raw_exact strong_selectors parity_hasse exact_crt canonical_hull real_closure finite_packets rigid_groupoid finite_kernel owner_action sir owner_master joint_owner acl_owner_geometry finite_lift mi_geometry owner_transversal safe_readings direct_owner_closure hkn_reservoir terminal_powers full_rows profile_helly relative_mi rank_induction unary_support full_code reset_order unary_hn relational_completion unary_fresh_frames quotient_transport simultaneous_quotients finite_fibres point_generated_sap ap_character clone_sap orbital_cover_boundary pair_safe_split full_phase_lift; do
            python3 tools/build_formalization_module.py --module "$module" --check
          done
          python3 tools/check_formalization_coordination.py --check --require-launch
          for control in tools/check_*_controls.py; do
            python3 "$control"
          done

      # Cache the toolchain, not multi-gigabyte per-commit .lake workspaces.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Install pinned Lean and Lake
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      # Source/configuration identity is checked before any provider artifact
      # is restored. This resolves the exact manifest without updating pins.
      - name: Materialize pinned external EPPA package
        run: lake env true

      - name: Bind external EPPA dependency cache identity
        id: eppa_key
        run: python3 tools/verify_external_provider.py --cache-key --github-output --os "${{ runner.os }}" --arch "${{ runner.arch }}"

      - name: Bind vendored Ramsey dependency cache identity
        id: ramsey_key
        run: python3 tools/verify_ramsey_provider.py --cache-key --github-output --os "${{ runner.os }}" --arch "${{ runner.arch }}"

      # Follow all CCO edges first. The pinned Mathlib cache command filters
      # CCO imports, so `cache get CCO.lean` cannot discover these roots.
      - name: Download targeted Mathlib cache
        shell: bash
        run: |
          python3 tools/mathlib_cache_roots.py --include-provider --reject-broad > /tmp/cco-mathlib-roots.txt
          mapfile -t roots < /tmp/cco-mathlib-roots.txt
          lake exe cache get "${roots[@]}"

      # This fixed dependency key excludes the changing CCO commit. The
      # complete provider output tree includes input traces and native parts.
      - name: Cache compiled external EPPA provider
        uses: actions/cache@v5
        with:
          path: .lake/packages/AllThoseEPPA/.lake/build
          key: ${{ steps.eppa_key.outputs.key }}

      - name: Build and verify pinned external EPPA facade
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_external_provider.py --repair
          lake --rehash build +AllThoseEPPA.MainTheorems
          python3 tools/verify_external_provider.py --require-complete

      - name: Cache compiled vendored Ramsey provider
        uses: actions/cache@v5
        with:
          path: vendor/ramsey/.lake/build
          key: ${{ steps.ramsey_key.outputs.key }}

      - name: Build and verify vendored Ramsey facade
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_ramsey_provider.py --repair
          lake --rehash build +CCORamsey
          python3 tools/verify_ramsey_provider.py --require-complete

      # Reuse project artifacts only. Lake checks source/dependency traces;
      # a restored cache never replaces the build or the transitive audit.
      - name: Cache incremental CCO build
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: cco-project-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            cco-project-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      # Detect inconsistent manual/cached snapshots by hashing actual CCO
      # olean bytes, source inputs and compiled import headers. Preserve valid children.
      - name: Repair inconsistent project artifacts
        run: python3 tools/verify_project_cache.py --repair

      - name: Build Lean project with actual input hashes
        run: lake --rehash build

      - name: Verify complete current source closure before audit
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/verify_project_cache.py --require-complete; then
            # One different recovery: discard project outputs, retain all
            # dependency caches, then rebuild with no copied CCO artifacts.
            python3 tools/clear_project_cache.py
            lake --rehash build
            python3 tools/verify_project_cache.py --require-complete
          fi
          python3 tools/verify_external_provider.py --require-complete
          python3 tools/verify_ramsey_provider.py --require-complete

      - name: Audit the verified current source closure
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: CCO
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      # The pinned audit script also calls `lake build`. Check again after it
      # so the final job cannot pass with a changed or older root closure.
      - name: Verify final audited project artifacts
        run: |
          python3 tools/verify_project_cache.py --require-complete
          python3 tools/verify_external_provider.py --require-complete
          python3 tools/verify_ramsey_provider.py --require-complete
